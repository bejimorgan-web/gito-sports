services:
  - type: web
    name: gito-backend
    runtime: node
    plan: starter
    buildCommand: npm ci && echo "[render] building commit $(git rev-parse HEAD)" && rm -rf apps/backend/dist && npm run build -w packages/shared && npm run build -w apps/backend && npx playwright install --with-deps chromium
    startCommand: node apps/backend/dist/server.js
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: gito-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/gito.sqlite
      - key: BACKUP_DIR
        value: /var/data/backups
      - key: MAX_BACKUPS
        value: "5"
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: AI_CLASSIFICATION_ENABLED
        value: "false"
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: https://gito-sports.onrender.com
      - key: FOOTBALL_DATA_API_KEY
        sync: false
      - key: API_FOOTBALL_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
